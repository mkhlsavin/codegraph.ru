<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" width="1600" height="720" viewBox="0 0 1600 720">
  <title id="title">CodeGraph как управляющий слой SDLC</title>
  <desc id="desc">Команда передает задачу и критерии в CodeGraph. CodeGraph работает через существующий стек и возвращает проверяемый результат на инженерное ревью.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#2563eb"/></marker>
    <style>.bg{fill:#f8fafc}.card{fill:#fff;stroke:#94a3b8;stroke-width:2}.core{fill:#eaf3ff;stroke:#2563eb;stroke-width:3}.title{font:700 30px Inter,Arial,sans-serif;fill:#0f172a}.label{font:700 25px Inter,Arial,sans-serif;fill:#0f172a}.text{font:400 19px Inter,Arial,sans-serif;fill:#475569}.rel{font:600 17px Inter,Arial,sans-serif;fill:#1e3a5f}.line{fill:none;stroke:#2563eb;stroke-width:3;marker-end:url(#arrow)}</style>
  </defs>
  <rect class="bg" width="1600" height="720" rx="28"/>
  <text class="title" x="800" y="65" text-anchor="middle">CodeGraph как управляющий слой SDLC</text>
  <rect class="card" x="70" y="225" width="360" height="170" rx="20"/>
  <text class="label" x="250" y="282" text-anchor="middle">Команда клиента</text>
  <text class="text" x="250" y="325" text-anchor="middle">Задает цель, критерии</text>
  <text class="text" x="250" y="355" text-anchor="middle">и принимает результат</text>
  <rect class="core" x="610" y="205" width="380" height="210" rx="24"/>
  <text class="label" x="800" y="270" text-anchor="middle">CodeGraph</text>
  <text class="text" x="800" y="315" text-anchor="middle">Управляет проверяемым</text>
  <text class="text" x="800" y="345" text-anchor="middle">маршрутом задачи</text>
  <text class="text" x="800" y="375" text-anchor="middle">и evidence lanes</text>
  <rect class="card" x="1170" y="225" width="360" height="170" rx="20"/>
  <text class="label" x="1350" y="282" text-anchor="middle">Инженерное ревью</text>
  <text class="text" x="1350" y="325" text-anchor="middle">Человек оценивает риск</text>
  <text class="text" x="1350" y="355" text-anchor="middle">и решает вопрос выпуска</text>
  <rect class="card" x="570" y="520" width="460" height="125" rx="20"/>
  <text class="label" x="800" y="570" text-anchor="middle">Текущий стек разработки</text>
  <text class="text" x="800" y="610" text-anchor="middle">Tracker · Git · CI/CD · Docs · IDE</text>
  <path class="line" d="M430 310H610"/><text class="rel" x="520" y="286" text-anchor="middle">задача и критерии</text>
  <path class="line" d="M990 310H1170"/><text class="rel" x="1080" y="286" text-anchor="middle">evidence и риски</text>
  <path class="line" d="M800 415V520"/><text class="rel" x="820" y="475">настроенные интеграции</text>
</svg>
