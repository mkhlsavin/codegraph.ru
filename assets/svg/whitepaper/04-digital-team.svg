<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" width="1600" height="980" viewBox="0 0 1600 980">
  <title id="title">Цифровая команда CodeGraph</title>
  <desc id="desc">Ролевые линии планирования, реализации, независимых проверок, документации и финансового контроля работают через handoff и предъявляют evidence в pre-completion gate.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2563eb"/></marker><style>.bg{fill:#f8fafc}.asset{fill:#fff7ed;stroke:#c2410c;stroke-width:2}.lane{fill:#eaf3ff;stroke:#2563eb;stroke-width:2}.finance{fill:#fefce8;stroke:#ca8a04;stroke-width:2}.gate{fill:#ecfdf5;stroke:#0f766e;stroke-width:3}.title{font:700 30px Inter,Arial,sans-serif;fill:#0f172a}.label{font:700 21px Inter,Arial,sans-serif;fill:#0f172a}.roles{font:600 16px Inter,Arial,sans-serif;fill:#2563eb}.text{font:400 16px Inter,Arial,sans-serif;fill:#475569}.line{fill:none;stroke:#2563eb;stroke-width:2.5;marker-end:url(#arrow)}</style></defs>
  <rect class="bg" width="1600" height="980" rx="28"/><text class="title" x="800" y="55" text-anchor="middle">Цифровая команда и управляемое завершение работы</text>
  <rect class="asset" x="250" y="105" width="430" height="120" rx="18"/><text class="label" x="465" y="148" text-anchor="middle">Role contracts</text><text class="roles" x="465" y="178" text-anchor="middle">digital_employees · YAML · Markdown</text><text class="text" x="465" y="205" text-anchor="middle">13 ролей, права, навыки и workflow</text>
  <rect class="asset" x="920" y="105" width="430" height="120" rx="18"/><text class="label" x="1135" y="148" text-anchor="middle">Authoritative task state</text><text class="roles" x="1135" y="178" text-anchor="middle">PostgreSQL 17</text><text class="text" x="1135" y="205" text-anchor="middle">Task · handoff · evidence · AI FinOps</text>
  <rect class="lane" x="55" y="350" width="340" height="160" rx="20"/><text class="label" x="225" y="397" text-anchor="middle">Постановка и план</text><text class="roles" x="225" y="430" text-anchor="middle">Кира · Сергей · Анна</text><text class="text" x="225" y="468" text-anchor="middle">Цель, требования, критерии</text>
  <rect class="lane" x="435" y="350" width="340" height="160" rx="20"/><text class="label" x="605" y="397" text-anchor="middle">Реализация</text><text class="roles" x="605" y="430" text-anchor="middle">Дмитрий</text><text class="text" x="605" y="468" text-anchor="middle">Изменения в утвержденном scope</text>
  <rect class="lane" x="815" y="350" width="340" height="160" rx="20"/><text class="label" x="985" y="397" text-anchor="middle">Независимые проверки</text><text class="roles" x="985" y="430" text-anchor="middle">Рита · Вера · Лена</text><text class="text" x="985" y="468" text-anchor="middle">Архитектура, AppSec и QA</text>
  <rect class="lane" x="1195" y="350" width="350" height="160" rx="20"/><text class="label" x="1370" y="397" text-anchor="middle">Знания и трассировка</text><text class="roles" x="1370" y="430" text-anchor="middle">Борис · Иван · Олег</text><text class="text" x="1370" y="468" text-anchor="middle">Docs, traceability и support</text>
  <rect class="finance" x="245" y="690" width="360" height="145" rx="20"/><text class="label" x="425" y="735" text-anchor="middle">Финансовый контроль</text><text class="roles" x="425" y="768" text-anchor="middle">Ева</text><text class="text" x="425" y="802" text-anchor="middle">Время, токены, стоимость</text>
  <rect class="lane" x="680" y="690" width="310" height="145" rx="20"/><text class="label" x="835" y="740" text-anchor="middle">Handoff</text><text class="roles" x="835" y="772" text-anchor="middle">Typed governance contract</text><text class="text" x="835" y="805" text-anchor="middle">Передает ответственность</text>
  <rect class="gate" x="1065" y="670" width="390" height="185" rx="22"/><text class="label" x="1260" y="725" text-anchor="middle">Pre-completion gate</text><text class="roles" x="1260" y="758" text-anchor="middle">Server-authoritative policy</text><text class="text" x="1260" y="795" text-anchor="middle">Закрывает только полный evidence</text><text class="text" x="1260" y="823" text-anchor="middle">включая reconciliation Евы</text>
  <path class="line" d="M465 225 225 350"/><path class="line" d="M395 430H435"/><path class="line" d="M775 430H815"/><path class="line" d="M1155 430H1195"/><path class="line" d="M605 510 425 690"/><path class="line" d="M605 510 835 690"/><path class="line" d="M985 510 1260 670"/><path class="line" d="M1370 510 1260 670"/><path class="line" d="M605 835H1065"/><path class="line" d="M835 690 1085 225"/><path class="line" d="M1260 670 1135 225"/>
</svg>
