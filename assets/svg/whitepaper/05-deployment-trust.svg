<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" width="1600" height="980" viewBox="0 0 1600 980">
  <title id="title">Размещение кода, индекса и управляющего состояния</title>
  <desc id="desc">Исходный код, DuckDB, PostgreSQL, OpenViking и процессы CodeGraph находятся в локальной или клиентской среде. Git hosting и AI provider являются опциональными внешними системами.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2563eb"/></marker><style>.bg{fill:#f8fafc}.boundary{fill:#fff;stroke:#0f766e;stroke-width:3}.box{fill:#eaf3ff;stroke:#2563eb;stroke-width:2}.store{fill:#ecfeff;stroke:#0f766e;stroke-width:2}.external{fill:#fff7ed;stroke:#c2410c;stroke-width:2}.title{font:700 30px Inter,Arial,sans-serif;fill:#0f172a}.boundaryTitle{font:700 22px Inter,Arial,sans-serif;fill:#0f766e}.label{font:700 20px Inter,Arial,sans-serif;fill:#0f172a}.tech{font:600 15px Inter,Arial,sans-serif;fill:#2563eb}.text{font:400 15px Inter,Arial,sans-serif;fill:#475569}.line{fill:none;stroke:#2563eb;stroke-width:2.5;marker-end:url(#arrow)}.dashed{stroke-dasharray:8 7}</style></defs>
  <rect class="bg" width="1600" height="980" rx="28"/><text class="title" x="800" y="55" text-anchor="middle">Размещение кода, индекса и управляющего состояния</text>
  <rect class="boundary" x="65" y="105" width="1150" height="810" rx="24"/><text class="boundaryTitle" x="100" y="145">Локальная или клиентская среда · основная trust boundary</text>
  <rect class="box" x="125" y="210" width="300" height="135" rx="18"/><text class="label" x="275" y="252" text-anchor="middle">CodeGraph interfaces</text><text class="tech" x="275" y="282" text-anchor="middle">FastAPI · MCP · CLI</text><text class="text" x="275" y="315" text-anchor="middle">Локальные endpoints</text>
  <rect class="box" x="485" y="210" width="280" height="135" rx="18"/><text class="label" x="625" y="252" text-anchor="middle">GoCPG</text><text class="tech" x="625" y="282" text-anchor="middle">Go process · gRPC</text><text class="text" x="625" y="315" text-anchor="middle">Строит граф кода</text>
  <rect class="box" x="825" y="210" width="325" height="135" rx="18"/><text class="label" x="987" y="252" text-anchor="middle">Workflow execution</text><text class="tech" x="987" y="282" text-anchor="middle">Temporal worker</text><text class="text" x="987" y="315" text-anchor="middle">Продолжает durable workflow</text>
  <rect class="store" x="125" y="470" width="300" height="135" rx="18"/><text class="label" x="275" y="512" text-anchor="middle">Authoritative state</text><text class="tech" x="275" y="542" text-anchor="middle">PostgreSQL 17</text><text class="text" x="275" y="575" text-anchor="middle">Tasks, evidence, AI FinOps</text>
  <rect class="store" x="485" y="470" width="280" height="135" rx="18"/><text class="label" x="625" y="512" text-anchor="middle">CPG index</text><text class="tech" x="625" y="542" text-anchor="middle">DuckDB files</text><text class="text" x="625" y="575" text-anchor="middle">Per-project graph</text>
  <rect class="store" x="825" y="470" width="325" height="135" rx="18"/><text class="label" x="987" y="512" text-anchor="middle">Project memory</text><text class="tech" x="987" y="542" text-anchor="middle">OpenViking</text><text class="text" x="987" y="575" text-anchor="middle">Документы и контекст</text>
  <rect class="store" x="360" y="720" width="520" height="135" rx="18"/><text class="label" x="620" y="762" text-anchor="middle">Repository checkout</text><text class="tech" x="620" y="792" text-anchor="middle">Filesystem · Git</text><text class="text" x="620" y="825" text-anchor="middle">Исходный код и Git state остаются у клиента</text>
  <rect class="external" x="1300" y="245" width="240" height="130" rx="18"/><text class="label" x="1420" y="290" text-anchor="middle">Git hosting</text><text class="text" x="1420" y="325" text-anchor="middle">Опционально</text>
  <rect class="external" x="1300" y="520" width="240" height="130" rx="18"/><text class="label" x="1420" y="565" text-anchor="middle">AI provider</text><text class="text" x="1420" y="600" text-anchor="middle">Опционально · HTTPS</text>
  <path class="line" d="M425 277H485"/><path class="line" d="M625 345V470"/><path class="line" d="M275 345V470"/><path class="line" d="M987 345 350 470"/><path class="line" d="M275 605 500 720"/><path class="line" d="M625 605V720"/><path class="line" d="M987 605 740 720"/>
  <path class="line dashed" d="M425 245 1300 310"/><path class="line dashed" d="M425 315 1300 585"/>
</svg>
