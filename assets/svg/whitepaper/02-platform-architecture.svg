<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" width="1600" height="960" viewBox="0 0 1600 960">
  <title id="title">Логическая архитектура платформы CodeGraph</title>
  <desc id="desc">Внутри CodeGraph интерфейсы связывают оркестрацию задач и структурный анализ с PostgreSQL, DuckDB и контрактами цифровой команды. Репозиторий, OpenViking и Temporal находятся за системной границей.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2563eb"/></marker><style>.bg{fill:#f8fafc}.boundary{fill:#fff;stroke:#64748b;stroke-width:2;stroke-dasharray:10 8}.box{fill:#eaf3ff;stroke:#2563eb;stroke-width:2}.store{fill:#ecfeff;stroke:#0f766e;stroke-width:2}.ext{fill:#fff7ed;stroke:#c2410c;stroke-width:2}.title{font:700 30px Inter,Arial,sans-serif;fill:#0f172a}.boundaryTitle{font:700 22px Inter,Arial,sans-serif;fill:#334155}.label{font:700 21px Inter,Arial,sans-serif;fill:#0f172a}.tech{font:600 16px Inter,Arial,sans-serif;fill:#2563eb}.text{font:400 16px Inter,Arial,sans-serif;fill:#475569}.line{fill:none;stroke:#2563eb;stroke-width:2.5;marker-end:url(#arrow)}</style></defs>
  <rect class="bg" width="1600" height="960" rx="28"/><text class="title" x="800" y="52" text-anchor="middle">Логическая архитектура платформы CodeGraph</text>
  <rect class="ext" x="105" y="100" width="300" height="120" rx="18"/><text class="label" x="255" y="145" text-anchor="middle">Репозиторий</text><text class="text" x="255" y="180" text-anchor="middle">Исходный код и Git state</text>
  <rect class="ext" x="650" y="100" width="300" height="120" rx="18"/><text class="label" x="800" y="145" text-anchor="middle">OpenViking</text><text class="text" x="800" y="180" text-anchor="middle">Контекст и память проекта</text>
  <rect class="ext" x="1195" y="100" width="300" height="120" rx="18"/><text class="label" x="1345" y="145" text-anchor="middle">Temporal service</text><text class="text" x="1345" y="180" text-anchor="middle">Durable workflows</text>
  <rect class="boundary" x="80" y="285" width="1440" height="610" rx="24"/><text class="boundaryTitle" x="115" y="325">CodeGraph</text>
  <rect class="box" x="145" y="380" width="350" height="155" rx="20"/><text class="label" x="320" y="425" text-anchor="middle">Интерфейсы</text><text class="tech" x="320" y="458" text-anchor="middle">Web UI · FastAPI · MCP · CLI</text><text class="text" x="320" y="495" text-anchor="middle">Принимают запросы</text>
  <rect class="box" x="625" y="380" width="350" height="155" rx="20"/><text class="label" x="800" y="425" text-anchor="middle">Оркестрация задач</text><text class="tech" x="800" y="458" text-anchor="middle">FastAPI · Temporal worker</text><text class="text" x="800" y="495" text-anchor="middle">Task · handoff · gate</text>
  <rect class="box" x="1105" y="380" width="350" height="155" rx="20"/><text class="label" x="1280" y="425" text-anchor="middle">Структурный анализ</text><text class="tech" x="1280" y="458" text-anchor="middle">GoCPG · gRPC</text><text class="text" x="1280" y="495" text-anchor="middle">Граф свойств кода</text>
  <rect class="store" x="145" y="680" width="350" height="145" rx="20"/><text class="label" x="320" y="727" text-anchor="middle">Состояние работы</text><text class="tech" x="320" y="760" text-anchor="middle">PostgreSQL 17</text><text class="text" x="320" y="795" text-anchor="middle">Task и evidence state</text>
  <rect class="store" x="625" y="680" width="350" height="145" rx="20"/><text class="label" x="800" y="727" text-anchor="middle">Граф кода</text><text class="tech" x="800" y="760" text-anchor="middle">DuckDB per project</text><text class="text" x="800" y="795" text-anchor="middle">Узлы, связи и индексы</text>
  <rect class="store" x="1105" y="680" width="350" height="145" rx="20"/><text class="label" x="1280" y="727" text-anchor="middle">Контракты ролей</text><text class="tech" x="1280" y="760" text-anchor="middle">YAML · Markdown</text><text class="text" x="1280" y="795" text-anchor="middle">Права, навыки и workflow</text>
  <path class="line" d="M495 458H625"/><path class="line" d="M975 458H1105"/><path class="line" d="M800 535V680"/><path class="line" d="M1280 535V680"/><path class="line" d="M1160 535 900 680"/><path class="line" d="M320 680V535"/>
  <path class="line" d="M255 220 1200 380"/><path class="line" d="M800 220V380"/><path class="line" d="M1345 220 900 380"/>
</svg>
