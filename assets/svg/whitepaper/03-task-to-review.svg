<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" width="1600" height="900" viewBox="0 0 1600 900">
  <title id="title">Маршрут задачи до инженерного ревью</title>
  <desc id="desc">Шесть этапов: Task Capsule, impact scope, работа цифровых ролей, цикл проверка-исправление-повтор, pre-completion gate и инженерное ревью.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2563eb"/></marker><style>.bg{fill:#f8fafc}.card{fill:#fff;stroke:#94a3b8;stroke-width:2}.core{fill:#eaf3ff;stroke:#2563eb;stroke-width:2.5}.gate{fill:#ecfdf5;stroke:#0f766e;stroke-width:2.5}.num{fill:#2563eb}.numText{font:700 21px Inter,Arial,sans-serif;fill:#fff}.title{font:700 31px Inter,Arial,sans-serif;fill:#0f172a}.label{font:700 22px Inter,Arial,sans-serif;fill:#0f172a}.text{font:400 17px Inter,Arial,sans-serif;fill:#475569}.line{fill:none;stroke:#2563eb;stroke-width:3;marker-end:url(#arrow)}</style></defs>
  <rect class="bg" width="1600" height="900" rx="28"/><text class="title" x="800" y="62" text-anchor="middle">Маршрут задачи до инженерного ревью</text>
  <g transform="translate(80 165)"><rect class="core" width="400" height="180" rx="22"/><circle class="num" cx="42" cy="42" r="25"/><text class="numText" x="42" y="50" text-anchor="middle">1</text><text class="label" x="200" y="63" text-anchor="middle">Task Capsule</text><text class="text" x="200" y="108" text-anchor="middle">Цель · scope · критерии</text><text class="text" x="200" y="138" text-anchor="middle">PostgreSQL-backed state</text></g>
  <g transform="translate(600 165)"><rect class="core" width="400" height="180" rx="22"/><circle class="num" cx="42" cy="42" r="25"/><text class="numText" x="42" y="50" text-anchor="middle">2</text><text class="label" x="200" y="63" text-anchor="middle">Impact scope и контекст</text><text class="text" x="200" y="108" text-anchor="middle">GoCPG · DuckDB · OpenViking</text><text class="text" x="200" y="138" text-anchor="middle">Затронутые связи и evidence refs</text></g>
  <g transform="translate(1120 165)"><rect class="core" width="400" height="180" rx="22"/><circle class="num" cx="42" cy="42" r="25"/><text class="numText" x="42" y="50" text-anchor="middle">3</text><text class="label" x="200" y="63" text-anchor="middle">Цифровые сотрудники</text><text class="text" x="200" y="108" text-anchor="middle">Работа в разрешенном scope</text><text class="text" x="200" y="138" text-anchor="middle">Governed role lanes</text></g>
  <g transform="translate(1120 555)"><rect class="core" width="400" height="180" rx="22"/><circle class="num" cx="42" cy="42" r="25"/><text class="numText" x="42" y="50" text-anchor="middle">4</text><text class="label" x="200" y="63" text-anchor="middle">Проверка и исправление</text><text class="text" x="200" y="108" text-anchor="middle">Tests · validators · bounded patch</text><text class="text" x="200" y="138" text-anchor="middle">check → fix → repeat</text></g>
  <g transform="translate(600 555)"><rect class="gate" width="400" height="180" rx="22"/><circle class="num" cx="42" cy="42" r="25"/><text class="numText" x="42" y="50" text-anchor="middle">5</text><text class="label" x="200" y="63" text-anchor="middle">Pre-completion gate</text><text class="text" x="200" y="108" text-anchor="middle">Сверяет обязательные evidence lanes</text><text class="text" x="200" y="138" text-anchor="middle">Server-authoritative closure</text></g>
  <g transform="translate(80 555)"><rect class="card" width="400" height="180" rx="22"/><circle class="num" cx="42" cy="42" r="25"/><text class="numText" x="42" y="50" text-anchor="middle">6</text><text class="label" x="200" y="63" text-anchor="middle">Инженерное ревью</text><text class="text" x="200" y="108" text-anchor="middle">Архитектура · качество · риск</text><text class="text" x="200" y="138" text-anchor="middle">Решение человека</text></g>
  <path class="line" d="M480 255H600"/><path class="line" d="M1000 255H1120"/><path class="line" d="M1320 345V555"/><path class="line" d="M1120 645H1000"/><path class="line" d="M600 645H480"/>
</svg>
