  <script type="application/ld+json">

      {
        "@type": "Question",
        "name": "Что значит цифровая команда?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Это набор цифровых ролей, которые берут на себя ручной разбор задач, проверку изменений, подготовку выпуска и понятный ответ для руководителя. Люди остаются владельцами решений."
        }
      },
      {
        "@type": "Question",
        "name": "CodeGraph заменяет разработчиков?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Нет. CodeGraph не продаётся как замена инженерной команды. Он снимает с людей ручной разбор задач, проверки и сбор статуса, чтобы сильные инженеры меньше отвлекались."
        }
      },
      {
        "@type": "Question",
        "name": "Куда уходят данные о нашем коде?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Никуда. CodeGraph разворачивается локально внутри вашей инфраструктуры. Код анализируется на месте. Во внешние сервисы при необходимости передаются только текстовые запросы, но не исходный код."
        }
      },
      {
        "@type": "Question",
        "name": "Как считать снижение стоимости разработки?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Через исходный замер: сколько часов команда тратит на выбранный сценарий сейчас, какие шаги берёт на себя CodeGraph и сохраняется ли темп поставки."
        }
      },
      {
        "@type": "Question",
        "name": "Можно ли начать с одного сценария разработки?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Да. Пробный запуск лучше ограничить одним сценарием: разбор задач, проверка изменений, проверка безопасности или подготовка выпуска. Так проще сравнить часы команды до и после."
        }
      },
      {
        "@type": "Question",
        "name": "Как не потерять темп разработки во время пробного запуска?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Пробный запуск не ломает текущий процесс разработки. CodeGraph подключается к выбранному сценарию и сравнивает часы команды до и после без остановки поставки."
        }
      },
      {
        "@type": "Question",
        "name": "Не будет ли CodeGraph ещё одним инструментом, от которого команда устанет?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "CodeGraph снижает число разрозненных инструментов и ручных поисков. Вместо переходов между поиском по файлам, документацией, отчётами сканеров и вопросами коллегам команда получает один интерфейс для запросов к кодовой базе."
        }
      },
      {
        "@type": "Question",
        "name": "Не галлюцинирует ли CodeGraph как ChatGPT?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "В основе CodeGraph лежит детерминированный граф свойств кода. Языковая модель используется для понимания запроса и формулировки ответа, а не для самой проверки. Поэтому вывод опирается на структуру кода, связи и доказуемые пути, а не только на вероятностное предположение."
        }
      },
      {
        "@type": "Question",
        "name": "Мне проще спросить коллегу — зачем инструмент?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Большая часть повседневных вопросов к коду сводится к навигации: где это находится, кто вызывает эту функцию, что сломается при изменении. CodeGraph отвечает на такие вопросы напрямую и снижает нагрузку на ведущих инженеров."
        }
      },
      {
        "@type": "Question",

        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Продуктовый директор — 18+ лет в ИТ, технический директор — 15+ лет в кибербезопасности. Компания готовит следующий инвестиционный раунд. В контракт может быть включено депонирование исходного кода. Локальный экземпляр работает автономно и не зависит от внешнего сервиса."
        }
      },
      {
        "@type": "Question",
        "name": "А что если CodeGraph не заработает на нашей кодовой базе?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Пилот строится вокруг конкретного сценария: безопасность, разработка или конвейер сборки и поставки. Обычно достаточно 4-8 недель, чтобы проверить разбор кодовой базы, поиск зависимостей и качество находок на ваших данных."
        }
      },
      {
        "@type": "Question",
        "name": "Как работает защита от утечек для языковой модели?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "25+ шаблонов обнаружения конфиденциальных данных: учётные данные, персональные данные, шаблоны исходного кода. Режимы: блокировать, маскировать, предупреждать, журналировать. Фильтрация до и после работы языковой модели."
        }
      },
      {
        "@type": "Question",
        "name": "Какие SIEM системы поддерживаются?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "CodeGraph интегрируется с любой SIEM через 3 формата: Syslog RFC 5424 (универсальный), CEF (ArcSight), LEEF (IBM QRadar). Splunk, Elastic SIEM, MaxPatrol поддерживаются через Syslog."
        }
      },
      {
        "@type": "Question",
        "name": "Как обеспечивается соответствие ГОСТ Р 57580?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Полный аудит операций (SIEM интеграция), RBAC с 4 ролями и 21 разрешением, шифрование данных в состоянии покоя, локальное развёртывание в сертифицированной инфраструктуре."
        }
      },
      {
        "@type": "Question",
        "name": "Можно ли получить сертификацию ФСТЭК?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Сертификация ФСТЭК в плане развития. Архитектура спроектирована для развёртывания в сертифицированной инфраструктуре. Текущий статус: подготовка документации для сертификации."
        }
      },

        "@type": "Question",
        "name": "Как происходит обновление?",
        "acceptedAnswer": {
          "@type": "Answer",

        }
      }
