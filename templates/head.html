  <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "Что значит «цифровая команда»?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Это цифровые роли, которые берут на себя ручную рутину вокруг разработки. CodeGraph помогает разбирать задачи, проверять изменения, готовить выпуск и собирать понятный ответ для руководителя. Люди остаются владельцами решений, а команда может делать больше тем же составом."
      }
    },
    {
      "@type": "Question",
      "name": "CodeGraph заменяет разработчиков?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Нет. CodeGraph не продаётся как замена инженерной команды. Он снимает с людей ручной разбор задач, проверки и сбор статуса. Так сильные инженеры меньше отвлекаются и больше времени тратят на продукт."
      }
    },
    {
      "@type": "Question",
      "name": "Как считать снижение стоимости разработки?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Через исходный замер выбранного сценария и пробный запуск. Исходный замер: сколько часов и ролей занимает сценарий сейчас. Что снял CodeGraph: какие ручные шаги больше не делает команда. Темп: сохраняется ли выпуск без пропорционального расширения штата. Экономика: как меняется стоимость выбранного сценария. До проверки на вашей кодовой базе не обещаются точные проценты экономии или сокращение штата."
      }
    },
    {
      "@type": "Question",
      "name": "Можно ли начать с одного сценария разработки?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Да. Пробный запуск лучше начинать с одного понятного сценария: разбор задач, проверка изменений, проверка безопасности или подготовка выпуска. Так проще договориться об исходном замере, сравнить часы команды до и после и не смешивать результат с другими изменениями в процессе."
      }
    },
    {
      "@type": "Question",
      "name": "Куда уходят данные о нашем коде?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Никуда. CodeGraph разворачивается локально внутри вашей инфраструктуры. Код анализируется на месте. GigaChat/Yandex AI API получает только текстовые запросы (вопросы пользователей и сгенерированные промпты), но не исходный код."
      }
    },
    {
      "@type": "Question",
      "name": "Как работает DLP защита для LLM?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "25+ шаблонов обнаружения конфиденциальных данных: Учётные данные: API-ключи, пароли, токены доступа Персональные данные: email, телефоны, адреса, ИНН Шаблоны исходного кода Режимы работы: Блокировать (запрос), Маскировать (данные), Предупреждать , Журналировать . Фильтрация применяется как до отправки в LLM, так и после получения ответа."
      }
    },
    {
      "@type": "Question",
      "name": "Какие SIEM системы поддерживаются?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "CodeGraph интегрируется с любой SIEM системой через 3 формата: Syslog RFC 5424 — универсальный формат CEF (Common Event Format) — ArcSight LEEF (Log Event Extended Format) — IBM QRadar Splunk, Elastic SIEM, MaxPatrol также поддерживаются через Syslog."
      }
    },
    {
      "@type": "Question",
      "name": "Как обеспечивается соответствие ГОСТ Р 57580?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "CodeGraph обеспечивает: Полный аудит операций (SIEM интеграция) RBAC с 4 ролями и 21 разрешением Шифрование данных в состоянии покоя Локальное развёртывание в сертифицированной инфраструктуре"
      }
    },
    {
      "@type": "Question",
      "name": "Можно ли получить сертификацию ФСТЭК?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Сертификация ФСТЭК в плане развития. Архитектура спроектирована для развертывания в сертифицированной инфраструктуре. Текущий статус: подготовка документации для сертификации."
      }
    },
    {
      "@type": "Question",
      "name": "Какой SLA?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Для корпоративных клиентов: Время реакции: 4 часа для критических проблем Время реакции: 24 часа для важных проблем Время реакции: 72 часа для стандартных запросов Выделенный Telegram-канал для оперативной связи. Доступность системы определяется вашей инфраструктурой — CodeGraph разворачивается локально."
      }
    },
    {
      "@type": "Question",
      "name": "Как происходит обновление?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Docker-образы с семантическим версионированием . Обновления без простоя через плавное развёртывание Kubernetes. Автоматические исправления безопасности. Журнал изменений и руководства по миграции для каждого релиза."
      }
    },
    {
      "@type": "Question",
      "name": "Не будет ли CodeGraph ещё одним инструментом, от которого команда устанет?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "CodeGraph не добавляет ещё один инструмент, а сокращает число разрозненных точек входа. Вместо поиска по файлам, устаревшей документации, отдельных отчётов качества и постоянных вопросов коллегам команда получает один интерфейс для работы с кодовой базой. Развёртывание — 1-2 дня. Индексация 1M строк — 30 минут. Интерфейс — вопрос на естественном языке, ничего не нужно учить."
      }
    },
    {
      "@type": "Question",
      "name": "Не галлюцинирует ли CodeGraph как ChatGPT?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Ядро CodeGraph — детерминированный граф свойств кода (CPG) : AST, CFG, деревья доминаторов, достигающие определения. Это математика, а не вероятности. Когда система говорит «функция A вызывает функцию B» — это факт из реального графа, а не предположение LLM. LLM используется только для двух вещей: понять вопрос на естественном языке и сформулировать ответ. Сам анализ — детерминированный. Гибридный RAG даёт +33,6% F1 по сравнению с чисто векторным подходом."
      }
    },
    {
      "@type": "Question",
      "name": "Мне проще спросить коллегу — зачем инструмент?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Из 5 вопросов в день ~80% — это «где?» и «что вызывает?», а не «почему именно так?». CodeGraph закрывает те 80%, которые не требуют глубокого контекста. Оставшиеся 20% — вы спрашиваете коллегу, но вместо 5 прерываний в день — одно , осмысленное. CodeGraph показывает не только файл и строку — он показывает цепочку вызовов, поток данных и связанные коммиты."
      }
    },
    {
      "@type": "Question",
      "name": "Вы стартап — что если вы закроетесь через год?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Стратегия устойчивости: Опытная команда : CPO — 18+ лет в ИТ, CTO — 15+ лет в кибербезопасности Финансирование : компания готовит следующий инвестиционный раунд Депонирование кода : готовы включить в контракт депонирование исходного кода Автономность : локальное развёртывание, встроенный DuckDB, нет критической зависимости от внешнего вендора SLA: 99,9% доступность, время реакции 4/24/72 часа."
      }
    },
    {
      "@type": "Question",
      "name": "А что если CodeGraph не заработает на нашей кодовой базе?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Пробный запуск с исходным замером и заранее согласованными критериями — цель: проверить до 3 выбранных сценариев за 4-8 недель. Три формата: Безопасность — анализ потоков данных, поиск уязвимостей Разработка — онбординг + поиск по коду CI/CD — интеграция в MR с автоматическими комментариями До старта фиксируем исходный замер, критерии результата и границы сценария, чтобы решение о масштабировании опиралось на проверенные данные."
      }
    }
  ]
}
