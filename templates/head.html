  <script type="application/ld+json">

  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "Что значит «цифровая команда»?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Это цифровые роли, которые берут на себя ручную рутину вокруг разработки. CodeGraph помогает разбирать задачи, проверять изменения, готовить выпуск и собирать понятный ответ для руководителя. Люди остаются владельцами решений, а команда может делать больше тем же составом."
      }
    },
    {
      "@type": "Question",
      "name": "CodeGraph заменяет разработчиков?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Нет. CodeGraph не продаётся как замена инженерной команды. Он снимает с людей ручной разбор задач, проверки и сбор статуса. Так сильные инженеры меньше отвлекаются и больше времени тратят на продукт."
      }
    },
    {
      "@type": "Question",
      "name": "Как считать снижение стоимости разработки?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Через исходный замер выбранного сценария и пробный запуск. Исходный замер: сколько часов и ролей занимает сценарий сейчас. Что снял CodeGraph: какие ручные шаги больше не делает команда. Темп: сохраняется ли выпуск без пропорционального расширения штата. Экономика: как меняется стоимость выбранного сценария. До проверки на вашей кодовой базе не обещаются точные проценты экономии или сокращение штата."
      }
    },
    {
      "@type": "Question",
      "name": "Можно ли начать с одного сценария разработки?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Да. Пробный запуск лучше начинать с одного понятного сценария: разбор задач, проверка изменений, проверка безопасности или подготовка выпуска. Так проще договориться об исходном замере, сравнить часы команды до и после и не смешивать результат с другими изменениями в процессе."
      }
    },
    {
      "@type": "Question",
      "name": "Куда уходят данные о нашем коде?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Потоки данных зависят от выбранной topology и провайдеров. Для локального или изолированного контура до запуска фиксируются разрешённые интеграции, категории передаваемых данных, egress и ограничения; абсолютное отсутствие передачи требует проверки конкретной конфигурации."
      }
    },
    {
      "@type": "Question",
      "name": "Как работает DLP защита для LLM?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Доступный набор DLP-правил и точки их применения зависят от versioned configuration. Перед публикацией или пилотом проверяются категории данных, режимы, provider path и ограничения."
      }
    },
    {
      "@type": "Question",
      "name": "Как проверяется интеграция с SIEM?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Доступность SIEM-экспорта зависит от adapter, версии и конфигурации. Наличие общего формата не доказывает live-совместимость с конкретной системой; она подтверждается connection test."
      }
    },
    {
      "@type": "Question",
      "name": "Какие технические контроли относятся к требованиям ГОСТ Р 57580?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "В проверенном scope доступны внутренние технические контроли аудита, доступа, шифрования и локального развёртывания. Они создают evidence для оценки заказчиком, но не являются независимым заключением о соответствии или сертификацией."
      }
    },
    {
      "@type": "Question",
      "name": "Можно ли получить сертификацию ФСТЭК?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Независимая сертификация ФСТЭК не подтверждена. Возможные шаги сертификации публикуются только после отдельного датированного roadmap decision и не выводятся из архитектуры продукта."
      }
    },
    {
      "@type": "Question",
      "name": "Какой SLA?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "SLA, доступность и время реакции определяются только конкретным договором и выбранной topology. До согласования коммерческого предложения публичные числовые гарантии не применяются."
      }
    },
    {
      "@type": "Question",
      "name": "Как происходит обновление?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Docker-образы с семантическим версионированием . Обновления без простоя через плавное развёртывание Kubernetes. Автоматические исправления безопасности. Журнал изменений и руководства по миграции для каждого релиза."
      }
    },
    {
      "@type": "Question",
      "name": "Не будет ли CodeGraph ещё одним инструментом, от которого команда устанет?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "CodeGraph связывает требования, код, тесты и evidence в одном маршруте. Срок развёртывания, время индексации и первый полезный результат зависят от topology, размера и языков репозитория; их фиксируют как гипотезы конкретного пилота и измеряют по согласованному protocol."
      }
    },
    {
      "@type": "Question",
      "name": "Не галлюцинирует ли CodeGraph как ChatGPT?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "CodeGraph сочетает структурные алгоритмы CPG и модельные компоненты. Каждый результат должен показывать источник, scope и ограничения: свойства отдельного check не переносятся автоматически на остальные результаты, а benchmark публикуется только с dataset и protocol."
      }
    },
    {
      "@type": "Question",
      "name": "Мне проще спросить коллегу — зачем инструмент?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Повторяемые вопросы о расположении и связях можно проверять по графу, а вопросы о причинах и решениях остаются у команды. Фактический эффект измеряется на baseline конкретного пилота."
      }
    },
    {
      "@type": "Question",
      "name": "Вы стартап — что если вы закроетесь через год?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Условия поддержки, депонирования, доступности и continuity фиксируются в конкретном договоре. Локальная topology может снизить отдельные внешние зависимости, но её фактическая автономность проверяется по deployment и egress matrix."
      }
    },
    {
      "@type": "Question",
      "name": "А что если CodeGraph не заработает на нашей кодовой базе?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Пилот начинается с одной выбранной функциональности и заранее согласованных baseline, traceability criteria, guardrails и scale/fix/stop rule. Срок, состав команды и target являются гипотезами конкретного pilot protocol, а не стандартными обещаниями продукта."
      }
    }
  ]
}
