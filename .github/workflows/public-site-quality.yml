name: Public site quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  semantic-visual-tailwind:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout public site
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install pinned Tailwind dependencies
        run: npm ci

      - name: Rebuild minified Tailwind bundle
        run: npm run build:tailwind

      - name: Verify reproducible Tailwind projection
        run: git diff --exit-code -- css/tailwind.min.css

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install semantic and browser checks
        run: |
          python -m pip install --disable-pip-version-check pytest beautifulsoup4 playwright
          python -m playwright install --with-deps chromium

      - name: Run semantic, claims, Tailwind, and responsive contracts
        run: |
          pytest \
            tests/test_story_1113_semantic_contract.py \
            tests/test_public_claims_patch.py \
            tests/test_tailwind_foundation.py \
            tests/test_header_responsive_css.py \
            tests/test_nested_page_context_browser.py \
            -q

      - name: Enforce Russian copy score on every page
        run: python tests/ru_text_score_audit.py --minimum 9.1

      - name: Run five-profile visual and accessibility audit
        run: |
          python tests/visual_semantic_audit.py \
            --base-url "http://story1113.local" \
            --output "${{ runner.temp }}/story-1113-public-site" \
            --label "story-1113-ci" \
            --workers 6 \
            --enforce

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-1113-public-site-evidence
          path: ${{ runner.temp }}/story-1113-public-site
          if-no-files-found: error
          retention-days: 14

  live-release-smoke:
    if: github.event_name == 'push'
    needs: semantic-visual-tailwind
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout published artifact
        uses: actions/checkout@v4

      - name: Wait for the public CDN and verify exact release
        run: |
          python tests/verify_live_release.py \
            --base-url "https://codegraph.ru/" \
            --release "landing-audit-20260722-v5" \
            --attempts 45 \
            --interval 20 \
            --output "${{ runner.temp }}/story-1113-live-release.json"

      - name: Upload live release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-1113-live-release-evidence
          path: ${{ runner.temp }}/story-1113-live-release.json
          if-no-files-found: error
          retention-days: 30
