name: Fix comparison copy once

on:
  push:
    branches:
      - feature/compare-platform-pages-20260829
    paths:
      - .github/workflows/audit-comparison-copy-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Correct acronym casing in comparison summaries
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "compare/codegraph-codebeamer.html": [("Alm-платформа", "ALM-платформа")],
              "compare/codegraph-devprom.html": [("alm-платформа", "ALM-платформа")],
              "compare/codegraph-gitlab.html": [("devsecops-платформа", "DevSecOps-платформа")],
              "compare/codegraph-microsoft-github.html": [("ии-помощников", "ИИ-помощников")],
              "compare/codegraph-polarion.html": [("Alm-платформа", "ALM-платформа")],
              "compare/codegraph-servicenow.html": [("и&nbsp;ии.", "и&nbsp;ИИ.")],
              "compare/codegraph-snyk.html": [("ии-разработки", "ИИ-разработки")],
              "compare/codegraph-sourcecraft.html": [
                  ("ci/cd", "CI/CD"),
                  ("ии-помощником", "ИИ-помощником"),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"{filename}: expected one occurrence of {old!r}, found {count}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
          PY

      - name: Commit corrections
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compare/codegraph-codebeamer.html \
            compare/codegraph-devprom.html \
            compare/codegraph-gitlab.html \
            compare/codegraph-microsoft-github.html \
            compare/codegraph-polarion.html \
            compare/codegraph-servicenow.html \
            compare/codegraph-snyk.html \
            compare/codegraph-sourcecraft.html
          git commit -m "Correct acronym casing in comparison summaries"
          git push origin HEAD
