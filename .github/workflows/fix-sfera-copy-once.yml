name: Fix Sfera copy once

on:
  push:
    branches:
      - feature/compare-platform-pages-20260829
    paths:
      - .github/workflows/fix-sfera-copy-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Correct abbreviation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("compare/codegraph-sfera-platform.html")
          html = path.read_text(encoding="utf-8")
          old = "Комплексная российская платформа управления жизненным циклом по."
          new = "Комплексная российская платформа управления жизненным циклом ПО."
          if old not in html:
              raise SystemExit("Expected Sfera copy not found")
          path.write_text(html.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Commit correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compare/codegraph-sfera-platform.html
          git commit -m "Correct Sfera Platform copy"
          git push origin HEAD
