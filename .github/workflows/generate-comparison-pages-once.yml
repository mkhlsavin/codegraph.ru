name: Generate comparison pages once

on:
  push:
    branches:
      - feature/compare-platform-pages-20260829
    paths:
      - .github/workflows/generate-comparison-pages-once.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore and run generator
        shell: bash
        run: |
          cat .github/compare-generator/part*.b64 | base64 --decode | gzip --decompress > /tmp/generate_compare_pages.py
          python -m py_compile /tmp/generate_compare_pages.py
          python /tmp/generate_compare_pages.py --root "$GITHUB_WORKSPACE"

      - name: Normalize CSP and Russian typography
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          existing = {
              "codegraph-checkmarx.html",
              "codegraph-fortify.html",
              "codegraph-pt-application-inspector.html",
              "codegraph-semgrep.html",
              "codegraph-sonarqube.html",
          }
          one_letter = re.compile(
              r"(?<![А-Яа-яЁё])([вксоуюияа]) (?=[А-Яа-яЁё0-9«])",
              re.IGNORECASE,
          )
          csp = (
              "  <meta http-equiv=\"Content-Security-Policy\" content=\""
              "default-src 'self'; base-uri 'self'; object-src 'none'; "
              "style-src 'self'; img-src 'self' data: https://mc.yandex.ru "
              "https://mc.yandex.com; font-src 'self'; script-src 'self' "
              "https://cdn.jsdelivr.net https://mc.yandex.ru https://mc.yandex.net "
              "https://mc.yandex.com; connect-src 'self' https://api.codegraph.ru "
              "https://mc.yandex.ru https://mc.yandex.net https://mc.yandex.com "
              "wss://mc.yandex.ru wss://mc.yandex.com; frame-src "
              "https://mc.yandex.ru https://mc.yandex.com; form-action 'self'\">"
          )

          for path in sorted(Path("compare").glob("codegraph-*.html")):
              if path.name in existing:
                  continue
              html = path.read_text(encoding="utf-8")
              html = one_letter.sub(lambda match: match.group(1) + "\u00a0", html)
              html = html.replace(" — ", "\u00a0— ")
              if 'http-equiv="Content-Security-Policy"' not in html:
                  html = html.replace("  <title>", csp + "\n  <title>", 1)
              path.write_text(html, encoding="utf-8")
          PY

      - name: Install validation dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pytest beautifulsoup4
          python -m pip install --disable-pip-version-check -r requirements-lint.txt

      - name: Validate generated pages
        shell: bash
        run: |
          python scripts/validate_freshness.py
          python scripts/check_design_system_contract.py
          python tests/ru_text_score_audit.py --minimum 9.1
          python -m pytest \
            tests/test_story_1113_semantic_contract.py \
            tests/test_public_claims_patch.py \
            tests/test_docs_repeat_audit_contract.py \
            -q

      - name: Commit generated pages
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compare sitemap.xml
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Add comparison page drafts for 20 platforms"
          git push origin HEAD
